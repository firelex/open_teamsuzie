<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture Mail</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  header, nav, .toolbar { padding: 8px; }
  table { border-collapse: collapse; width: 100%; display: block; min-height: 40px; }
  tr.row { cursor: pointer; }
  tr.row td { padding: 6px; border-bottom: 1px solid #ddd; }
  tr.unread { font-weight: bold; }
  [role="dialog"] { position: fixed; right: 20px; bottom: 20px; width: 480px; background: #fff; border: 1px solid #888; padding: 8px; }
  .chip { display: inline-block; background: #eef; margin: 2px; padding: 2px 6px; }
  [contenteditable] { min-height: 60px; border: 1px solid #ccc; }
  .hidden { display: none; }
</style>
</head>
<body>
<header role="banner">
  <input type="text" role="searchbox" aria-label="Search mail" id="search">
  <button id="account" aria-label="Fixture Account: Me (me@example.com)">Me</button>
</header>
<nav aria-label="Folders">
  <a href="#inbox">Inbox</a>
  <a href="#sent">Sent</a>
</nav>
<div role="tablist" aria-label="Ribbon" id="ribbon-tabs" class="hidden">
  <button role="tab" id="tab-home" aria-selected="true">Home</button>
  <button role="tab" id="tab-message" aria-selected="false">Message</button>
</div>
<div class="toolbar" role="toolbar" aria-label="Actions" id="home-panel">
  <button id="compose">__COMPOSE_LABEL__</button>
  <button aria-label="Refresh">⟳</button>
</div>
<main id="main"></main>
<!-- A hidden button with the same name must never count as a match. -->
<button class="hidden">Send</button>

<div role="dialog" aria-label="New Message" id="dialog" class="hidden">
  <div>
    <span id="chips"></span>
    <input type="text" role="combobox" aria-label="To recipients" id="to" aria-controls="suggestions">
  </div>
  <div><input type="text" aria-label="Subject" id="subject"></div>
  <div contenteditable="true" role="textbox" aria-label="Message Body" id="body"></div>
  <button id="send">Send</button>
  <button id="discard" aria-label="Discard draft">🗑</button>
</div>

<script>
const VARIANT = '__VARIANT__';
const ME = 'me@example.com';
window.__sendClicks = 0;
window.__sent = [];
window.__discards = 0;
window.__autocomplete = {};
// Drafts: two left behind by the service's tests (they carry its marker) and one of the user's own.
window.__drafts = [
  { id: 'd1', subject: 'Route check', body: 'Route check by email-agent: safe to discard.' },
  { id: 'd2', subject: 'Notes for Bob', body: 'Dear Bob, my real unfinished draft.' },
  { id: 'd3', subject: 'Re: Lunch on Tuesday?', body: 'Route check by email-agent: safe to discard.' },
];
let openDraftId = null;

const messages = [
  { id: 'm0', thread: 't1', from: 'alice@example.com', fromName: 'Alice Example', to: ME, subject: 'Quarterly numbers', date: 'Thu, Oct 23, 2026, 4:02 PM', dateShort: 'Thu 23/10/2026 16:02', body: 'Numbers coming tomorrow.', unread: false },
  { id: 'm1', thread: 't1', from: 'alice@example.com', fromName: 'Alice Example', to: ME, cc: 'dan@example.com', subject: 'Quarterly numbers', date: 'Fri, Oct 24, 2026, 9:15 AM', dateShort: 'Fri 24/10/2026 09:15', body: 'Here are the quarterly numbers.\nRevenue is up.', unread: true },
  { id: 'm2', thread: 't2', from: 'bob@example.org', fromName: 'Bob', to: ME, subject: 'Lunch on Tuesday?', date: 'Fri, Oct 24, 2026, 11:40 AM', dateShort: 'Fri 24/10/2026 11:40', body: 'Are you free for lunch on Tuesday?', unread: false },
];

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function latestPerThread(list) {
  const byThread = new Map();
  for (const m of list) byThread.set(m.thread, m);
  return [...byThread.values()].reverse();
}
function rowsHtml(list, label) {
  if (VARIANT === 'restyled') {
    // A redesign: a list of options instead of a table, new class names, a different id attribute, the date as text.
    return `<div role="listbox" aria-label="${label}" class="msg-list">` + list.map((m) => `
      <div role="option" class="msg-item${m.unread ? ' is-unread' : ''}" data-key="${m.id}" data-conv="${m.thread}" aria-label="${m.unread ? 'Unread ' : ''}${esc(m.fromName || m.to)} ${esc(m.subject)}">
        <span class="who" title="${esc(m.from)}">${esc(m.fromName || m.from)}</span>
        <span class="topic">${esc(m.subject)}</span>
        <span class="preview">${esc(m.body.slice(0, 40))}</span>
        <time class="stamp">${esc(m.dateShort || m.date)}</time>
      </div>`).join('') + '</div>';
  }
  return `<table role="grid" aria-label="${label}"><tbody>` + list.map((m) => `
    <tr class="row${m.unread ? ' unread' : ''}" data-id="${m.id}" data-thread="${m.thread}" aria-label="${m.unread ? 'unread, ' : ''}${esc(m.fromName || m.to)}, ${esc(m.subject)}">
      <td class="from"><span data-email="${esc(m.from)}">${esc(m.fromName || m.from)}</span></td>
      <td class="subject">${esc(m.subject)}</td>
      <td class="snippet">${esc(m.body.slice(0, 40))}</td>
      <td class="date"><span title="${esc(m.date)}">${esc(m.date.slice(5, 11))}</span></td>
    </tr>`).join('') + '</tbody></table>';
}
function messageHtml(id) {
  const msg = messages.find((m) => m.id === id) || messages.filter((m) => m.thread === id).pop();
  if (!msg) return '<p>Message not found</p>';
  const thread = messages.filter((m) => m.thread === msg.thread);
  return `<h2 class="subject">${esc(msg.subject)}</h2>` + thread.map((m) => `
    <div class="msg" data-message-id="${m.id}" role="listitem">
      <h3 class="sender-name">${esc(m.fromName)}</h3>
      <span class="sender" data-email="${esc(m.from)}">${esc(m.fromName)}</span>
      <span class="to" title="to ${esc(m.to)}">to ${esc(m.to)}</span>
      ${m.cc ? `<span class="cc" title="cc ${esc(m.cc)}">cc ${esc(m.cc)}</span>` : ''}
      <span class="when" title="${esc(m.date)}">${esc(m.date)}</span>
      <div class="body">${esc(m.body).replace(/\n/g, '<br>')}</div>
    </div>`).join('') +
    `<button id="reply" data-for="${msg.id}">Reply</button><div id="reply-slot"></div>`;
}
function render() {
  const hash = decodeURIComponent(location.hash || '#inbox');
  const main = document.getElementById('main');
  let match;
  if (hash === '#inbox') {
    main.innerHTML = rowsHtml(latestPerThread(messages), 'Inbox');
  } else if (hash === '#sent') {
    main.innerHTML = rowsHtml(window.__sent.map((s, i) => ({ id: 's' + i, thread: 'st' + i, from: s.to, fromName: s.to, to: s.to, subject: s.subject, date: s.date, body: s.body })), 'Sent');
  } else if (hash === '#drafts' || (match = /^#drafts\/search\/(.*)$/.exec(hash))) {
    const q = match ? match[1].toLowerCase() : '';
    const drafts = window.__drafts.filter((d) => !q || d.subject.toLowerCase().includes(q) || d.body.toLowerCase().includes(q));
    main.innerHTML = rowsHtml(drafts.map((d) => ({ id: d.id, thread: 'dt-' + d.id, from: ME, fromName: 'Draft', to: '', subject: d.subject, date: 'Sat, Oct 25, 2026, 1:00\u202fPM', body: d.body })), 'Drafts');
  } else if ((match = /^#drafts\/open\/(.+)$/.exec(hash))) {
    main.innerHTML = rowsHtml([], 'Drafts');
    const draft = window.__drafts.find((d) => d.id === match[1]);
    if (draft) {
      openDraftId = draft.id;
      document.getElementById('subject').value = draft.subject;
      document.getElementById('body').innerText = draft.body;
      document.getElementById('dialog').classList.remove('hidden');
    }
  } else if ((match = /^#search\/(.*)$/.exec(hash))) {
    const q = match[1].toLowerCase();
    main.innerHTML = rowsHtml(messages.filter((m) => m.subject.toLowerCase().includes(q) || m.from.includes(q)), 'Search results');
  } else if ((match = /^#(?:inbox|all)\/(.+)$/.exec(hash))) {
    main.innerHTML = messageHtml(match[1]);
  } else {
    main.innerHTML = '<p>Unknown view</p>';
  }
}
function recordSend(to, subject, body) {
  window.__sendClicks++;
  window.__sent.push({ to, subject, body, date: 'Sat, Oct 25, 2026, 1:00 PM' });
}
function chipsIn(el) { return [...el.querySelectorAll('.chip')].map((c) => c.dataset.email || c.__email); }
function addChip(container, value) {
  const address = window.__autocomplete[value] || value;
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.dataset.email = address;
  chip.textContent = address;
  if (window.__namedChips) {
    // Like Outlook with a known contact: a moment later the chip shows a name, the address only in its tooltip.
    chip.dataset.email = '';
    chip.textContent = '';
    setTimeout(() => {
      chip.dataset.email = address;
      chip.title = address;
      chip.textContent = address.split('@')[0].replace(/^./, (c) => c.toUpperCase());
    }, 300);
  }
  container.appendChild(chip);
}

window.addEventListener('hashchange', render);
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') location.hash = '#search/' + encodeURIComponent(e.target.value);
});
document.getElementById('main').addEventListener('click', (e) => {
  const row = e.target.closest('tr.row, [role="option"]');
  if (row && !location.hash.startsWith('#sent')) {
    location.hash = '#inbox/' + (row.dataset.id || row.dataset.key);
    return;
  }
  if (e.target.id === 'reply') {
    const msg = messages.find((m) => m.id === e.target.dataset.for);
    document.getElementById('reply-slot').innerHTML = `
      <div role="region" aria-label="Reply" id="reply-box">
        <span class="chips"><span class="chip" data-email="${esc(msg.from)}">${esc(msg.fromName)}</span></span>
        <div contenteditable="true" role="textbox" aria-label="Message Body" id="reply-body"></div>
        <button id="reply-send">Send</button>
        <button aria-label="Discard draft" id="reply-discard">🗑</button>
      </div>`;
    return;
  }
  if (e.target.id === 'reply-send') {
    const box = document.getElementById('reply-box');
    const subject = document.querySelector('h2.subject').textContent;
    recordSend(chipsIn(box).join(', '), 'Re: ' + subject, document.getElementById('reply-body').innerText);
    box.remove();
    return;
  }
  if (e.target.id === 'reply-discard') {
    window.__discards++;
    document.getElementById('reply-box').remove();
  }
});
// The ribbon variant behaves like the new Outlook: while a draft is open the ribbon shows its Message tab, and
// the Home tab's buttons (including Compose) are hidden until the draft is closed.
function showRibbonTab(tab) {
  if (VARIANT !== 'ribbon') return;
  document.getElementById('tab-home').setAttribute('aria-selected', String(tab === 'home'));
  document.getElementById('tab-message').setAttribute('aria-selected', String(tab === 'message'));
  document.getElementById('home-panel').classList.toggle('hidden', tab !== 'home');
}
if (VARIANT === 'ribbon') document.getElementById('ribbon-tabs').classList.remove('hidden');
document.getElementById('compose').addEventListener('click', () => {
  if (VARIANT === 'expire') {
    location.href = 'https://login.example.test/signin';
    return;
  }
  document.getElementById('dialog').classList.remove('hidden');
  showRibbonTab('message');
  document.getElementById('to').focus();
});
// Like Outlook: with __suggestions on, typing shows suggestions a moment later; picking one makes a chip that shows
// only the contact's name. Pressing Enter or Tab before picking makes no chip.
document.getElementById('to').addEventListener('input', (e) => {
  if (!window.__suggestions) return;
  document.getElementById('suggestions')?.remove();
  const typed = e.target.value.trim();
  setTimeout(() => {
    if (document.getElementById('to').value.trim() !== typed || !typed.includes('@')) return;
    const list = document.createElement('div');
    list.id = 'suggestions';
    list.setAttribute('role', 'listbox');
    list.setAttribute('aria-label', 'Suggested contacts');
    const name = window.__suggestions[typed];
    const option = document.createElement('div');
    option.setAttribute('role', 'option');
    option.setAttribute('aria-label', name ? name + ' - ' + typed : typed);
    option.textContent = name || typed;
    option.addEventListener('click', () => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.__email = typed;
      chip.textContent = name || typed;
      document.getElementById('chips').appendChild(chip);
      document.getElementById('to').value = '';
      list.remove();
      document.getElementById('to').focus();
    });
    list.appendChild(option);
    document.body.appendChild(list);
  }, 300);
});
document.getElementById('to').addEventListener('keydown', (e) => {
  const value = e.target.value.trim();
  if (window.__suggestions) return;
  if ((e.key === 'Tab' || e.key === 'Enter' || e.key === ',') && value) {
    // Like Gmail: only real key presses commit a recipient chip.
    if (!e.isTrusted) return;
    addChip(document.getElementById('chips'), value);
    e.target.value = '';
    if (e.key !== 'Tab') e.preventDefault();
  }
});
function closeDialog() {
  showRibbonTab('home');
  document.getElementById('dialog').classList.add('hidden');
  document.getElementById('chips').innerHTML = '';
  document.getElementById('to').value = '';
  document.getElementById('subject').value = '';
  document.getElementById('body').innerText = '';
}
// Keyboard shortcuts, like Gmail's: C opens a new message (outside text fields); Ctrl/Cmd+Enter sends it;
// ? shows the list of shortcuts, Escape closes it.
document.addEventListener('keydown', (e) => {
  const inField = e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]');
  if (!inField && e.key === '?') {
    const help = document.createElement('div');
    help.id = 'shortcut-help';
    help.setAttribute('role', 'dialog');
    help.setAttribute('aria-label', 'Keyboard shortcuts');
    help.innerHTML = '<h2>Keyboard shortcuts</h2><ul><li>C: new message</li><li>Ctrl+Enter or Cmd+Enter: send</li><li>/: search</li><li>E: archive</li></ul>';
    document.body.append(help);
    e.preventDefault();
  }
  if (e.key === 'Escape') {
    document.getElementById('shortcut-help')?.remove();
    // Closing an opened draft keeps it (like closing a draft window).
    if (openDraftId) {
      openDraftId = null;
      closeDialog();
      location.hash = '#drafts';
    }
  }
  if (!inField && e.key === 'c' && !e.ctrlKey && !e.metaKey) {
    document.getElementById('compose').click();
    e.preventDefault();
  }
  const dialogOpen = !document.getElementById('dialog').classList.contains('hidden');
  if (dialogOpen && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    document.getElementById('send').click();
    e.preventDefault();
  }
});
document.getElementById('send').addEventListener('click', () => {
  recordSend(chipsIn(document.getElementById('dialog')).join(', '), document.getElementById('subject').value, document.getElementById('body').innerText);
  closeDialog();
});
document.getElementById('discard').addEventListener('click', () => {
  if (window.__confirmDiscard && !document.getElementById('discard-confirm')) {
    // Like Outlook: discarding a new message first asks for confirmation.
    const confirm = document.createElement('div');
    confirm.id = 'discard-confirm';
    confirm.setAttribute('role', 'alertdialog');
    confirm.setAttribute('aria-label', 'Discard message?');
    confirm.innerHTML = '<p>Discard message?</p><button>OK</button><button>Cancel</button>';
    confirm.querySelectorAll('button')[0].addEventListener('click', () => { confirm.remove(); discardDraft(); });
    confirm.querySelectorAll('button')[1].addEventListener('click', () => confirm.remove());
    document.body.append(confirm);
    return;
  }
  discardDraft();
});
function discardDraft() {
  window.__discards++;
  if (openDraftId) {
    window.__drafts = window.__drafts.filter((d) => d.id !== openDraftId);
    openDraftId = null;
    closeDialog();
    location.hash = '#drafts';
    return;
  }
  closeDialog();
}
render();
</script>
</body>
</html>

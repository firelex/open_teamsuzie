[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docx-template-agent"
version = "0.1.0"
description = "Template-injection Word agent for Team Suzie. Fills a .docx template (letterhead + styles) with content addressed by named bracket-tokens or content controls, leaving the template's styles untouched."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1",
  "pypdf>=4.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
docx-template-agent = "docx_template_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_template_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

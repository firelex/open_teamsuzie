[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptx-template-agent"
version = "0.1.0"
description = "Template-injection PowerPoint agent for Team Suzie. Composes decks from an existing .pptx by filling named placeholders (python-pptx), preserving slide masters."
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openai>=1.50",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
pptx-template-agent = "pptx_template_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_template_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Team Suzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ev-100: #ebe8ff;
      --ev-700: #611fe2;
      --neutral-600: #525252;
      --neutral-700: #404040;
      --neutral-800: #262626;
      --destructive: #b91c1c;
      --destructive-bg: #fef2f2;
      --bg: #ffffff;
      --muted: #737373;
      --border: #e5e5e5;
      --fancy-gradient: linear-gradient(78deg, #7438FE -47.47%, #D267FF 100%);
      --header-gradient-v: linear-gradient(180deg, #E0FAFB 0%, #F5F7F2 100%);
      --violet-glow: 0 12px 32px -12px rgba(117, 71, 254, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    /* Match Tailwind's preflight: keep images inside their parent box so
       the hero doesn't overflow the left panel horizontally. */
    img { max-width: 100%; height: auto; display: block; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--neutral-800);
      background: var(--bg);
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      -webkit-font-smoothing: antialiased;
    }
    .layout { display: flex; min-height: 100vh; }
    .left {
      display: none;
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--header-gradient-v);
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 1024px) { .left { display: flex; } }
    .left .bg-img {
      position: absolute; height: 100%; pointer-events: none; opacity: 0.30;
    }
    .left .bg-img.l { left: -1rem; transform: rotate(-4deg); }
    .left .bg-img.r { right: -1.5rem; height: 140%; transform: rotate(170deg); }
    .left .panel { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 0; }
    .left .logo { height: 2rem; margin-bottom: 1.25rem; }
    .left .badge {
      display: inline-flex; align-items: center; gap: 0.375rem;
      background: var(--ev-100); color: var(--ev-700);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em;
      padding: 0.25rem 0.75rem; border-radius: 9999px; margin-bottom: 1rem;
    }
    .left .tagline {
      color: var(--neutral-800); text-align: center; max-width: 24rem;
      margin: 0 0 0.5rem; font-size: 1rem; font-weight: 700; line-height: 1.25;
    }
    .left .sub {
      color: var(--neutral-600); text-align: center; max-width: 18rem;
      margin: 0 0 2rem; font-size: 0.875rem;
    }
    .left .hero { max-height: 60vh; object-fit: contain; object-position: bottom; }

    .right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 1.5rem; }
    .form-wrap { width: 100%; max-width: 22rem; }
    .mobile-logo { display: flex; justify-content: center; margin-bottom: 2rem; }
    .mobile-logo img { height: 1.75rem; }
    @media (min-width: 1024px) { .mobile-logo { display: none; } }
    .eyebrow {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em;
      color: rgba(97, 31, 226, 0.7); margin: 0 0 0.5rem;
    }
    h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 0.25rem; }
    .lead { color: var(--muted); font-size: 0.875rem; margin: 0 0 2rem; }
    .err {
      padding: 0.75rem; font-size: 0.875rem; color: var(--destructive);
      background: var(--destructive-bg); border-radius: 6px; margin-bottom: 1rem;
    }
    .err:empty { display: none; }
    .field { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .field label { font-size: 0.875rem; font-weight: 500; }
    .field input {
      width: 100%; padding: 0.5rem 0.75rem; font-size: 0.875rem;
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .field input:focus {
      border-color: var(--ev-700);
      box-shadow: 0 0 0 4px rgba(117, 71, 254, 0.12);
    }
    button.primary {
      width: 100%; padding: 0.6rem 1rem; font-size: 0.875rem; font-weight: 600;
      color: #fff; background-image: var(--fancy-gradient); border: 0; border-radius: 9999px;
      cursor: pointer; box-shadow: var(--violet-glow); transition: opacity 0.15s;
      font-family: inherit;
    }
    button.primary:hover { opacity: 0.9; }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left">
      <img class="bg-img l" src="/assets/graph-effect.png" aria-hidden="true">
      <img class="bg-img r" src="/assets/graph-effect.png" aria-hidden="true">
      <div class="panel">
        <img class="logo" src="/assets/logo.svg" alt="Team Suzie">
        <div class="badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><path d="m7.5 4.21 4.5 2.6 4.5-2.6"></path><path d="m7.5 19.79V14.6L3 12"></path><path d="m21 12-4.5 2.6v5.19"></path><path d="M3.27 6.96 12 12.01l8.73-5.05"></path><path d="M12 22.08V12"></path></svg>
          Agent infrastructure
        </div>
        <p class="tagline">Every workflow problem is an org chart problem.</p>
        <p class="sub">Orchestrate teams of agents on the open business operating layer.</p>
        <img class="hero" src="/assets/team.webp" alt="Your AI organization">
      </div>
    </aside>
    <main class="right">
      <div class="form-wrap">
        <div class="mobile-logo"><img src="/assets/logo.svg" alt="Team Suzie"></div>
        <p class="eyebrow">Admin Console</p>
        <h1>Welcome back.</h1>
        <p class="lead">Sign in to your workspace.</p>
        <form method="post" action="/oauth/interaction/{{uid}}/login" novalidate>
          <div class="err">{{error}}</div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="primary">Sign in</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
